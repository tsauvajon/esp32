[package]
edition = "2024"
name = "pir-motion-sensor"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
name = "pir-motion-sensor"
path = "./src/bin/main.rs"
test = false

[dependencies]
blinksy = "0.11.0"
blinksy-esp = "0.11.0"
critical-section = "1.2.0"
embedded-io = "0.7.1"
esp-backtrace = { version = "0.18.1", features = [
  "esp32",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32", "log-04"] }
esp-hal = { version = "1.0.0", features = ["esp32", "log-04", "unstable"] }
esp-println = { version = "0.16.1", features = ["esp32", "log-04"] }
log = "0.4.27"
static_cell = "2.1.1"

[dev-dependencies]
embedded-test = { version = "0.7.0", default-features = false, features = [
  "log",
  "xtensa-semihosting",
] }
heapless = { version = "0.9.2", default-features = false }

[lib]
test = false
doctest = false

[[test]]
name = "lighting"
harness = false

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
