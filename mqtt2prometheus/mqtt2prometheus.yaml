mqtt:
  # The MQTT broker to connect to
  server: tcp://127.0.0.1:1883
  # Optional: Username and Password for authenticating with the MQTT Server
  user: mosquitto
  password: huit
  # Optional: for TLS client certificates
  # ca_cert: certs/AmazonRootCA1.pem
  # client_cert: certs/xxxxx-certificate.pem.crt
  # client_key: certs/xxxxx-private.pem.key
  # Optional: Used to specify ClientID. The default is <hostname>-<pid>
  # client_id: somedevice
  # The Topic path to subscribe to. Be aware that you have to specify the wildcard.
  #topic_path: v1/devices/me/+
  topic_path: home/+/+/+/state
  # Optional: Regular expression to extract the device ID from the topic path. The default regular expression, assumes
  # that the last "element" of the topic_path is the device id.
  # The regular expression must contain a named capture group with the name deviceid
  # For example the expression for tasamota based sensors is "tele/(?P<deviceid>.*)/.*"
  # device_id_regex: "(.*/)?(?P<deviceid>.*)"
  device_id_regex: "(?P<org>[^/]+)/(?P<location>[^/]+)/(?P<deviceid>[^/]+)/.*"
  # The MQTT QoS level
  qos: 1
cache:
  # Timeout. Each received metric will be presented for this time if no update is send via MQTT.
  # Set the timeout to -1 to disable the deletion of metrics from the cache. The exporter presents the ingest timestamp
  # to prometheus.
  timeout: 24h
json_parsing:
  # Separator. Used to split path to elements when accessing json fields.
  # You can access json fields with dots in it. F.E. {"key.name": {"nested": "value"}}
  # Just set separator to -> and use key.name->nested as mqtt_name
  separator: .

metrics:
  # Telemetry -----------------------------------------------------

  - prom_name: temperature_celsius
    mqtt_name: temperature_c
    help: Temperature in degrees Celsius
    type: gauge
    const_labels:
      payload: telemetry

  - prom_name: humidity_percent
    mqtt_name: humidity_pct
    help: Relative humidity in percent
    type: gauge
    const_labels:
      payload: telemetry

  # Status -----------------------------------------------------

  - prom_name: online
    mqtt_name: online
    help: 1 the Wi-Fi link is reported as up
    type: gauge
    raw_expression: "raw_value == true ? 1 : 0"
    const_labels:
      payload: status

  - prom_name: wifi_rssi_dbm
    mqtt_name: rssi_dbm
    help: Wi-Fi RSSI (signal strength) in dBm
    type: gauge
    const_labels:
      payload: status

  - prom_name: uptime_seconds
    mqtt_name: uptime_s
    help: Device uptime in seconds
    type: counter
    force_monotonicy: true
    const_labels:
      payload: status

  - prom_name: heap_total_bytes
    mqtt_name: heap_total_bytes
    help: Total heap size in bytes
    type: gauge
    const_labels:
      payload: status

  - prom_name: heap_used_bytes
    mqtt_name: heap_used_bytes
    help: Heap usage in bytes
    type: gauge
    const_labels:
      payload: status

  - prom_name: wifi_channel
    mqtt_name: channel
    help: Wi-Fi channel number
    type: gauge
    const_labels:
      payload: status

  - prom_name: last_sensor_ok_seconds
    mqtt_name: last_sensor_ok_seconds_ago
    help: Seconds elapsed since the last successful sensor reading
    type: gauge
    const_labels:
      payload: status
  
  # Metadata -----------------------------------------------------

  - prom_name: device_metadata_info
    mqtt_name: device_info
    help: Static device metadata exposed as labels
    type: gauge
    raw_expression: "1"
    const_labels:
      payload: status
    dynamic_labels:
      firmware: 'raw_value == nil ? "" : (raw_value["firmware"] == nil ? "" : raw_value["firmware"])'
      chip: 'raw_value == nil ? "" : (raw_value["chip"] == nil ? "" : raw_value["chip"])'
      mac: 'raw_value == nil ? "" : (raw_value["mac"] == nil ? "" : raw_value["mac"])'
      ip: 'raw_value == nil ? "" : (raw_value["ip"] == nil ? "" : raw_value["ip"])'
      bssid: 'raw_value == nil ? "" : (raw_value["bssid"] == nil ? "" : raw_value["bssid"])'

  - prom_name: device_reset_reason_info
    mqtt_name: reset_reason
    help: Last reset reason emitted by the firmware
    type: gauge
    raw_expression: "1"
    const_labels:
      payload: status
    dynamic_labels:
      reset_reason: "raw_value"

