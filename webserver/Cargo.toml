[package]
edition = "2024"
name = "webserver"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
name = "webserver"
path = "./src/bin/main.rs"

[dependencies]
critical-section = "1.2.0"
edge-dhcp = { version = "0.6.0", optional = true }
edge-nal = { version = "0.5.0", optional = true }
edge-nal-embassy = { version = "0.6.0", optional = true }
embassy-executor = { version = "0.9.1", features = ["log"] }
embassy-net = { version = "0.7.1", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embassy-time = { version = "0.5.0", features = ["log"] }
embedded-hal-async = "1.0.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.9.0"
esp-backtrace = { version = "0.18.1", features = [
  "esp32",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32", "log-04"] }
esp-hal = { version = "1.0.0", features = ["esp32", "log-04", "unstable"] }
esp-println = { version = "0.16.1", features = ["esp32", "log-04"] }
esp-radio = { version = "0.17.0", features = [
  "esp-alloc",
  "esp32",
  "log-04",
  "smoltcp",
  "unstable",
  "wifi",
] }
esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32",
  "log-04",
] }
log = "0.4.27"
picoserve = { version = "0.17.1", features = ["embassy", "alloc"] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
static_cell = "2.1.1"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = 2

[profile.dev.package.esp-radio]
opt-level = 2

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false

# https://docs.espressif.com/projects/rust/esp-radio/0.17.0/esp32/esp_radio/index.html#optimization-level
# It is necessary to build with optimization level 2 or 3 since otherwise, it might not even be able to connect or advertise.
[profile.release.package.esp-radio]
opt-level = 3

[features]
default = ["access-point"]

# Wi-Fi mode, either access-point or station
access-point = ["dhcp"]
station = []

dhcp = ["edge-dhcp", "edge-nal", "edge-nal-embassy"]
